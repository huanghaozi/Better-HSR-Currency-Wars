name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore "Better HSR-Currency Wars V11.csproj" --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build "Better HSR-Currency Wars V11.csproj" -c Release --no-restore
